<!doctype html><html lang="en"><head><meta charset="utf-8"><title>Poll poster A3</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,600;0,700;1,500;1,600&family=Inter:wght@500;600;700&display=swap">
<style>
@page { size: 297mm 420mm; margin: 0; }
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: Inter, sans-serif; color: #f4eee1; -webkit-print-color-adjust: exact; print-color-adjust: exact; font-variant-numeric: lining-nums; }
.dark { background: radial-gradient(70% 45% at 100% 0%, rgba(207,170,108,.28), transparent 60%), radial-gradient(70% 50% at 0% 100%, rgba(47,106,80,.65), transparent 60%), #0b1d15; }
.serif { font-family: "Cormorant Garamond", Georgia, serif; }
.mark { color: #cfaa6c; }
.qr { display: block; width: 100%; height: auto; }
.brand { display: flex; align-items: center; gap: .3em; font-family: "Cormorant Garamond", Georgia, serif; font-weight: 700; color: #fbf8f1; }
.brand .mark { width: 1.05em; height: 1.05em; }
em { font-style: italic; font-weight: 600; color: #e2c792; }

html,body{width:297mm;height:420mm}
.p{width:297mm;height:420mm;padding:22mm;display:flex;flex-direction:column;background:#fbf8f1;color:#17271f;border:6mm solid #0b1d15}
.brand{font-size:11mm;color:#17271f}
.k{margin-top:12mm;font-weight:700;font-size:5.5mm;letter-spacing:2mm;text-transform:uppercase;color:#7d5f30}
h1{margin-top:4mm;font-family:"Cormorant Garamond",serif;font-weight:700;font-size:26mm;line-height:.95}
h1 em{color:#7d5f30}
.sub{margin-top:5mm;font-size:6.5mm;color:#4a5a51}
.cols{margin-top:12mm;flex:1;display:grid;grid-template-columns:1fr 1fr;gap:8mm}
.col{border-radius:8mm;border:1mm dashed;display:flex;flex-direction:column;align-items:center;padding-top:8mm}
.yes{border-color:#2f6a50;background:rgba(47,106,80,.06)}.no{border-color:#b5503f;background:rgba(181,80,63,.05)}
.col span{font-family:"Cormorant Garamond",serif;font-weight:700;font-size:22mm;line-height:1}
.yes span{color:#2f6a50}.no span{color:#b5503f}
.col small{margin-top:2mm;font-size:5mm;font-weight:600;color:#4a5a51}
.foot{margin-top:8mm;text-align:center;font-size:5.5mm;font-weight:600;color:#21503c}

</style></head><body><div class="p"><div class="brand"><svg class="mark" viewBox="0 0 40 40"><path d="M6 18.5 20 7l14 11.5V32a2.5 2.5 0 0 1-2.5 2.5h-23A2.5 2.5 0 0 1 6 32Z" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linejoin="round"/><circle cx="20" cy="24" r="6.2" fill="currentColor"/><circle cx="20" cy="24" r="3.7" fill="none" stroke="#0b1d15" stroke-width="1.1" opacity=".5"/></svg>Deposera</div>
<p class="k">Quick poll · add a sticker</p><h1>Have you lost a deposit <em>without a clear reason?</em></h1>
<p class="sub">You, a friend or a family member. Put one dot in a column.</p>
<div class="cols"><div class="col yes"><span>Yes</span><small>It happened</small></div><div class="col no"><span>No</span><small>Never</small></div></div>
<p class="foot">Deposera: deposits kept only for real, proven damage.</p></div></body></html>
