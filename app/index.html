<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>App prototype | Deposera</title>
  <meta name="description" content="A clickable prototype of the Deposera app for tenants. Demo only: nothing is saved or sent.">
  <meta name="theme-color" content="#0b1d15">
  <link rel="icon" href="../assets/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;0,700;1,500&amp;family=Inter:wght@400;500;600;700&amp;display=swap">
  <link rel="stylesheet" href="app.css">
  <script src="app.js" defer></script>
</head>
<body>
  <div class="proto">
    <aside class="proto__panel" aria-label="About this prototype">
      <a class="proto__brand" href="../index.html" aria-label="Back to the Deposera website">
        <svg viewBox="0 0 40 40" aria-hidden="true" focusable="false">
          <path d="M6 18.5 20 7l14 11.5V32a2.5 2.5 0 0 1-2.5 2.5h-23A2.5 2.5 0 0 1 6 32Z" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/>
          <circle cx="20" cy="24" r="6.2" fill="currentColor"/>
          <circle cx="20" cy="24" r="3.7" fill="none" stroke="#0b1d15" stroke-width="1.1" opacity=".5"/>
        </svg>
        <span>Deposera</span>
      </a>

      <div class="proto__intro">
        <p class="proto__eyebrow">App prototype</p>
        <h1>Your deposit, <em>always in view</em></h1>
        <p>A clickable prototype of the Deposera app for tenants. Tap around the phone, or jump to a moment in the tenancy.</p>
      </div>

      <fieldset class="stages">
        <legend>Jump to a moment</legend>
        <div class="stages__list" data-stages></div>
      </fieldset>

      <p class="proto__note">Demo only. Nothing is saved or sent. <a href="../index.html">Back to the website</a></p>
    </aside>

    <div class="phone">
      <div class="phone__screen" data-screen>
        <div class="statusbar" aria-hidden="true">
          <span>9:41</span>
          <span class="statusbar__island"></span>
          <span class="statusbar__icons">
            <svg viewBox="0 0 18 12"><path d="M1 11h2V8H1zm4 0h2V6H5zm4 0h2V3H9zm4 0h2V1h-2z" fill="currentColor"/></svg>
            <svg viewBox="0 0 26 12"><rect x=".5" y=".5" width="22" height="11" rx="3" fill="none" stroke="currentColor"/><rect x="2" y="2" width="16" height="8" rx="1.5" fill="currentColor"/><path d="M24 4v4" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>
          </span>
        </div>

        <main class="view" data-view tabindex="-1"></main>

        <nav class="tabbar" aria-label="App sections" data-tabbar></nav>

        <div class="sheet" data-sheet hidden>
          <div class="sheet__backdrop" data-close></div>
          <div class="sheet__panel" role="dialog" aria-modal="true" aria-labelledby="sheet-title" data-sheet-panel></div>
        </div>

        <p class="toast" data-toast role="status" aria-live="polite"></p>
      </div>
    </div>
  </div>
</body>
</html>
